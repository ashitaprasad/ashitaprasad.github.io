<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cheatsheets | Ashita Prasad</title>
    <link rel="icon" href="/media/favicon.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx"
      crossorigin="anonymous"
    />
    <style>
      body {
        background: linear-gradient(180deg, #f8f9fa 0%, #eef2ff 100%);
        color: #1f2937;
        min-height: 100vh;
      }

      .page-shell {
        max-width: 980px;
        margin: 0 auto;
        padding: 72px 20px 48px;
      }

      .badge-soft {
        background: rgba(99, 102, 241, 0.12);
        color: #4f46e5;
        border: 1px solid rgba(99, 102, 241, 0.2);
      }

      .card {
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .card:hover {
        transform: translateY(-2px);
        box-shadow: 0 18px 32px rgba(15, 23, 42, 0.1);
      }

      .btn-primary-soft {
        background: #111827;
        border-color: #111827;
        padding: 0.7rem 1.1rem;
        border-radius: 12px;
      }

      .btn-primary-soft:hover {
        background: #1f2937;
        border-color: #1f2937;
      }

      .btn-outline-soft {
        border-color: #d1d5db;
        color: #111827;
        border-radius: 12px;
        padding: 0.7rem 1.1rem;
      }

      .btn-outline-soft:hover {
        background: #f3f4f6;
        border-color: #cbd5e1;
        color: #111827;
      }
    </style>
  </head>
  <body>
    <main class="page-shell">
      <div class="text-center mb-5">
        <span class="badge badge-soft px-3 py-2 rounded-pill fw-semibold mb-3">
          Quick reference library
        </span>
        <h1 class="display-5 fw-bold mb-3">Cheatsheets</h1>
        <p class="lead text-secondary mb-0">
          Handy references for practical tooling, workflows, and concepts.
        </p>
      </div>

      <div class="row g-4 justify-content-center">
        <div class="col-md-6 col-lg-5">
          <article class="card h-100">
            <div class="card-body p-4">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h4 mb-0">MCP Cheatsheet</h2>
                <span class="badge text-bg-dark rounded-pill">PDF</span>
              </div>

              <p class="text-secondary mb-4">
                A concise guide covering Model Context Protocol concepts.
              </p>

              <div class="d-flex gap-2 flex-wrap">
                <a
                  href="./MCP%20cheatsheet.pdf"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="btn btn-primary-soft text-white"
                >
                  Open PDF
                </a>
                <a
                  href="./MCP%20cheatsheet.pdf"
                  download
                  class="btn btn-outline-soft"
                >
                  Download
                </a>
              </div>
            </div>
          </article>
        </div>
      </div>

      <div class="text-center mt-5">
        <a href="../" class="btn btn-link text-decoration-none text-dark fw-semibold">
          ← Back to home
        </a>
      </div>
    </main>
  </body>
</html>
